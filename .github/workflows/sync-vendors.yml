name: Sync vendor data and deploy

# Runs biweekly (1st and 15th of the month), pulling vendor listings from
# public cloud marketplace catalogs into data/vendors.yaml, then rebuilds
# and redeploys the site so the Zero Trust Matrix page's Vendors view stays
# current. Also runnable on demand.
#
# Requires repo secrets:
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY — an IAM user with ONLY the
#     least-privilege policy in scripts/vendor-sync/aws-iam-policy.json
#     attached (aws-marketplace:SearchFacets + SearchListings — the two
#     calls this script actually makes). Self-serve, no AWS approval
#     needed. Static keys by design here (not OIDC role assumption).
#   AZURE_MARKETPLACE_API_KEY — optional. Requires enrolling the Azure
#     subscription in the "Discovery Api Key Early Access" preview
#     feature (may need an Azure support ticket for approval), then
#     generating a key via an ARM API call (see README.md). Not self-
#     serve. If unset, the Azure source is skipped gracefully.
on:
  schedule:
    - cron: '0 6 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/vendor-sync/package-lock.json

      - name: Install vendor-sync dependencies
        working-directory: scripts/vendor-sync
        run: npm ci

      - name: Run vendor sync
        working-directory: scripts/vendor-sync
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_MARKETPLACE_REGION || 'us-east-1' }}
          AZURE_MARKETPLACE_API_KEY: ${{ secrets.AZURE_MARKETPLACE_API_KEY }}
        run: npm run sync

      - name: Commit updated vendor data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: sync vendor data from marketplace APIs [skip ci]'
          file_pattern: data/vendors.yaml
          commit_user_name: 'ztlens-bot'
          commit_user_email: 'actions@github.com'

      - name: Setup Node for site build
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install site dependencies
        working-directory: web
        run: npm ci

      - name: Build site
        working-directory: web
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

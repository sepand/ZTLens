# Hand-curated floor list of vendors widely deployed by large
# enterprises in each pillar's capability area. This exists because
# marketplace category search (rating- or relevance-sorted) can bury
# well-known enterprise names behind smaller tools with fewer but
# higher-scored public reviews — enterprise deals often go through
# private offers that never accumulate public marketplace ratings.
#
# This is cloud-agnostic (not tied to a specific marketplace listing)
# and merged into every pillar ahead of live AWS/Azure results, so it
# acts as a guaranteed floor rather than something that can be pushed
# out by the per-pillar cap. Links point to marketplace SEARCH results
# (not a specific product page), since we haven't verified each vendor
# still has an active listing at any given time.
#
# This is a starting point reflecting commonly-cited category leaders,
# not exhaustive and not a ranking — add to it as needed.
#
# last_reviewed: 2026-08-14


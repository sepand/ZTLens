# Hand-maintained vendor seed list for sources with no usable public
# catalog-search API. Currently: Google Cloud Marketplace, which only
# exposes a Consumer Procurement API for orders/entitlements — no
# products.list or category-search endpoint exists (verified directly
# against Google's REST resource tree, Aug 2026).
#
# This file is NOT touched by scripts/vendor-sync/index.mjs's automated
# fetch — it's merged in on every run, so hand edits here persist across
# the biweekly sync. Entries listed here are believed to be listed on
# the named marketplace as of the date below, but this isn't verified by
# a live API call the way AWS/Azure entries are — spot-check periodically.
#
# `function` assigns each vendor to the NIST CSF 2.0 function
# (govern/identify/protect/detect/respond/recover) its product is most
# associated with, matching the classification used in
# curated-enterprise-vendors.yaml.
#
# last_reviewed: 2026-08-14

